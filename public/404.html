<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Inspiria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center text-center p-3 bg-light">
  
  <div class="card p-5 border-0 shadow-lg rounded-4 max-width-500">
    <div class="mb-4">
      <i class="fa-solid fa-compass-drafting text-danger fs-1 animate-bounce"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark mb-2">404</h1>
    <h2 class="h5 text-secondary mb-3">Wisdom Path Not Found</h2>
    <p class="text-muted mb-4">The URL page you are attempting to locate is outside of our quotes database index.</p>
    <a href="/" class="btn btn-dark rounded-pill px-4">
      <i class="fa-solid fa-house me-2"></i> Return Home
    </a>
  </div>

  <style>
    .max-width-500 {
      max-width: 500px;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-bounce {
      animation: bounce 2s infinite ease-in-out;
    }
  </style>

</body>
</html>
